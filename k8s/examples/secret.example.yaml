# EXAMPLE ONLY - do not apply with a real key and never commit one.
# Create the real secret from an environment variable instead (see docs/KUBERNETES.md):
#   kubectl create secret generic api-secret -n pm-service --from-literal=API_KEY="$env:API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: pm-service
type: Opaque
stringData:
  API_KEY: change-me
