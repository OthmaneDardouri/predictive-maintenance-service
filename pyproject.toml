[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-service"
version = "0.1.0"
description = "Predictive maintenance service based on the AI4I 2020 dataset"
requires-python = ">=3.15"
dependencies = [
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "fastapi==0.156.8",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e tests need the docker compose stack: run them with `python scripts/run_e2e.py`.
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end tests against the running docker compose stack"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
