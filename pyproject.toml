[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-service"
version = "0.1.0"
description = "Predictive maintenance service based on the AI4I 2020 dataset"
requires-python = ">=3.15"
dependencies = [
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
