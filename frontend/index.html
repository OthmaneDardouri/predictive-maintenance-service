<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Health Console</title>
  </head>
  <body>
    <main class="container">
      <h1>Machine Health Console</h1>
      <p class="subtitle">Predict the failure risk of a milling machine from its sensor readings.</p>

      <form id="predict-form" novalidate>
        <label>
          Product quality
          <select name="type" required>
            <option value="L">L (low)</option>
            <option value="M" selected>M (medium)</option>
            <option value="H">H (high)</option>
          </select>
        </label>
        <label>
          Air temperature [K]
          <input name="air_temperature_k" type="number" step="0.1" min="250" max="350" value="298.1" required />
        </label>
        <label>
          Process temperature [K]
          <input name="process_temperature_k" type="number" step="0.1" min="250" max="400" value="308.6" required />
        </label>
        <label>
          Rotational speed [rpm]
          <input name="rotational_speed_rpm" type="number" step="1" min="1" max="5000" value="1551" required />
        </label>
        <label>
          Torque [Nm]
          <input name="torque_nm" type="number" step="0.1" min="0" max="200" value="42.8" required />
        </label>
        <label>
          Tool wear [min]
          <input name="tool_wear_min" type="number" step="1" min="0" max="500" value="0" required />
        </label>
        <button type="submit">Predict</button>
      </form>

      <section id="result" class="result" hidden aria-live="polite"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
